name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # Tests run on in-memory H2: no database needed on the CI server
      - name: Compile, run tests and check code coverage
        run: ./mvnw -B clean verify
