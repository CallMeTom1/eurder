spring.application.name=eurder

DB_URL=jdbc:h2:mem:eurder;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
DB_USERNAME=sa
DB_PASSWORD=sa
JWT_SECRET=test-secret-only-used-by-the-automated-tests

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.test.database.replace=none

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

eurder.jwt.secret=${JWT_SECRET}
eurder.jwt.access-token-ttl=15m
eurder.jwt.refresh-token-ttl=7d

springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.disable-swagger-default-url=true
