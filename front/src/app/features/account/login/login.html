<div class="mx-auto flex w-full max-w-sm flex-col gap-6">
  <app-page-header [title]="'nav.login' | translate" />

  <form [formRoot]="loginForm" class="flex w-full flex-col gap-4">
    @if (registered() && !problem()) {
      <p
        role="status"
        class="flex items-center gap-2 rounded-md bg-success-container p-4 text-on-success-container"
      >
        {{ 'account.created' | translate }}
      </p>
    }
    @if (problem(); as problem) {
      <app-error-state [message]="problem.code | translate: problem.params" />
    }

    <app-form-field [label]="'account.email' | translate" [field]="loginForm.email">
      <mat-form-field>
        <input
          matInput
          appFieldControl
          type="email"
          autocomplete="username"
          [formField]="loginForm.email"
        />
        <mat-error>
          <app-field-errors [field]="loginForm.email" />
        </mat-error>
      </mat-form-field>
    </app-form-field>

    <app-form-field [label]="'account.password' | translate" [field]="loginForm.password">
      <mat-form-field>
        <input
          matInput
          appFieldControl
          type="password"
          autocomplete="current-password"
          [formField]="loginForm.password"
        />
        <mat-error>
          <app-field-errors [field]="loginForm.password" />
        </mat-error>
      </mat-form-field>
    </app-form-field>

    <button matButton="filled" type="submit" [disabled]="loginForm().submitting()">
      {{ 'nav.login' | translate }}
    </button>

    <p class="mt-4 text-on-surface-variant">
      {{ 'account.noAccount' | translate }}
      <a routerLink="/register" class="text-primary underline">{{ 'nav.register' | translate }}</a>
    </p>
  </form>
</div>
