<app-form-field [label]="'account.firstName' | translate" [field]="form().firstName">
  <mat-form-field>
    <input matInput appFieldControl autocomplete="given-name" [formField]="form().firstName" />
    <mat-error>
      <app-field-errors [field]="form().firstName" />
    </mat-error>
  </mat-form-field>
</app-form-field>

<app-form-field [label]="'account.lastName' | translate" [field]="form().lastName">
  <mat-form-field>
    <input matInput appFieldControl autocomplete="family-name" [formField]="form().lastName" />
    <mat-error>
      <app-field-errors [field]="form().lastName" />
    </mat-error>
  </mat-form-field>
</app-form-field>

<app-form-field [label]="'account.email' | translate" [field]="form().email">
  <mat-form-field>
    <input matInput appFieldControl type="email" autocomplete="email" [formField]="form().email" />
    <mat-error>
      <app-field-errors [field]="form().email" />
    </mat-error>
  </mat-form-field>
</app-form-field>

@if (password(); as password) {
  <app-form-field [label]="'account.password' | translate" [field]="password">
    <mat-form-field>
      <input
        matInput
        appFieldControl
        type="password"
        autocomplete="new-password"
        [formField]="password"
      />
      <mat-hint>{{ 'account.passwordHint' | translate }}</mat-hint>
      <mat-error>
        <app-field-errors [field]="password" />
      </mat-error>
    </mat-form-field>
  </app-form-field>
}

<app-form-field [label]="'account.phoneNumber' | translate" [field]="form().phoneNumber">
  <mat-form-field>
    <input
      matInput
      appFieldControl
      type="tel"
      autocomplete="tel"
      [formField]="form().phoneNumber"
    />
    <mat-error>
      <app-field-errors [field]="form().phoneNumber" />
    </mat-error>
  </mat-form-field>
</app-form-field>

<fieldset class="mt-4 grid gap-x-4 gap-y-3 sm:col-span-2 sm:grid-cols-[1fr_11rem]">
  <legend class="mb-2 [font:var(--mat-sys-title-medium)]">
    {{ 'account.address' | translate }}
  </legend>

  <app-form-field [label]="'account.street' | translate" [field]="form().address.street">
    <mat-form-field>
      <input
        matInput
        appFieldControl
        autocomplete="address-line1"
        [formField]="form().address.street"
      />
      <mat-error>
        <app-field-errors [field]="form().address.street" />
      </mat-error>
    </mat-form-field>
  </app-form-field>

  <app-form-field [label]="'account.houseNumber' | translate" [field]="form().address.houseNumber">
    <mat-form-field>
      <input matInput appFieldControl [formField]="form().address.houseNumber" />
      <mat-error>
        <app-field-errors [field]="form().address.houseNumber" />
      </mat-error>
    </mat-form-field>
  </app-form-field>

  <app-form-field [label]="'account.city' | translate" [field]="form().address.city">
    <mat-form-field>
      <input
        matInput
        appFieldControl
        autocomplete="address-level2"
        [formField]="form().address.city"
      />
      <mat-error>
        <app-field-errors [field]="form().address.city" />
      </mat-error>
    </mat-form-field>
  </app-form-field>

  <app-form-field [label]="'account.postalCode' | translate" [field]="form().address.postalCode">
    <mat-form-field>
      <input
        matInput
        appFieldControl
        autocomplete="postal-code"
        [formField]="form().address.postalCode"
      />
      <mat-error>
        <app-field-errors [field]="form().address.postalCode" />
      </mat-error>
    </mat-form-field>
  </app-form-field>

  <app-form-field
    class="sm:col-span-2"
    [label]="'account.country' | translate"
    [field]="form().address.country"
  >
    <mat-form-field>
      <mat-select appFieldControl [formField]="form().address.country">
        @for (country of countries; track country) {
          <mat-option [value]="country">{{ 'country.' + country | translate }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </app-form-field>
</fieldset>
