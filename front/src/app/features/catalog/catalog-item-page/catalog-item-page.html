@if (item.isLoading()) {
  <app-loading-state />
} @else if (item.error()) {
  <app-error-state [message]="problem().code | translate: problem().params" />
} @else if (item.value(); as item) {
  <app-page-header [title]="item.name" />
  <article class="grid gap-6 md:grid-cols-[minmax(0,1fr)_minmax(0,1fr)]">
    <span
      aria-hidden="true"
      class="flex aspect-[4/3] items-center justify-center rounded-md bg-surface-container text-on-surface-variant"
    >
      <mat-icon>image</mat-icon>
    </span>
    <div class="flex flex-col gap-4">
      <p class="[font:var(--mat-sys-headline-small)]">{{ item.priceInCents | price }}</p>
      <p class="whitespace-pre-line text-on-surface-variant">{{ item.description }}</p>
    </div>
  </article>
}

<div>
  <a matButton="outlined" routerLink="/catalog">{{ 'catalog.back' | translate }}</a>
</div>
