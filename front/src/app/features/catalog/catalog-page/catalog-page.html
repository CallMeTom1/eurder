<app-page-header [title]="'nav.catalog' | translate">
  <mat-form-field actions subscriptSizing="dynamic" class="w-72">
    <mat-label>{{ 'catalog.search' | translate }}</mat-label>
    <input matInput type="search" name="query" [(ngModel)]="query" />
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>
</app-page-header>

@if (items.isLoading()) {
  <app-loading-state />
} @else if (items.error()) {
  <app-error-state
    [message]="problem().code | translate: problem().params"
    [retryable]="true"
    (retry)="items.reload()"
  />
} @else if (items.value().length === 0) {
  <app-empty-state [message]="'catalog.empty' | translate" />
} @else if (visibleItems().length === 0) {
  <app-empty-state
    icon="search_off"
    [message]="'catalog.noMatch' | translate: { query: query().trim() }"
  />
} @else {
  <ul class="grid grid-cols-[repeat(auto-fill,minmax(14rem,1fr))] gap-4">
    @for (item of visibleItems(); track item.id) {
      <li data-testid="catalog-item">
        <app-item-card
          [name]="item.name"
          [priceInCents]="item.priceInCents"
          [link]="['/catalog', item.id]"
        >
          <app-add-to-basket-button [item]="item" />
        </app-item-card>
      </li>
    }
  </ul>
}
