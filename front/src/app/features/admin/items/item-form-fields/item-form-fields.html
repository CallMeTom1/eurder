<app-form-field
  class="sm:col-span-3"
  [label]="'catalog.field.name' | translate"
  [field]="form().name"
>
  <mat-form-field>
    <input matInput appFieldControl [formField]="form().name" />
    <mat-error>
      <app-field-errors [field]="form().name" />
    </mat-error>
  </mat-form-field>
</app-form-field>

<app-form-field
  class="sm:col-span-3"
  [label]="'catalog.field.description' | translate"
  [field]="form().description"
>
  <mat-form-field>
    <textarea matInput appFieldControl rows="4" [formField]="form().description"></textarea>
    <mat-hint align="end"><app-char-counter [field]="form().description" [max]="255" /></mat-hint>
    <mat-error>
      <app-field-errors [field]="form().description" />
      <app-char-counter class="float-end" [field]="form().description" [max]="255" />
    </mat-error>
  </mat-form-field>
</app-form-field>

<app-form-field [label]="'catalog.field.price' | translate" [field]="form().price">
  <mat-form-field>
    <span matTextPrefix>€&nbsp;</span>
    <input matInput appFieldControl type="number" step="0.01" [formField]="form().price" />
    <mat-error>
      <app-field-errors [field]="form().price" />
    </mat-error>
  </mat-form-field>
</app-form-field>

<app-form-field [label]="'catalog.field.stock' | translate" [field]="form().stock">
  <mat-form-field>
    <input matInput appFieldControl type="number" step="1" [formField]="form().stock" />
    <mat-error>
      <app-field-errors [field]="form().stock" />
    </mat-error>
  </mat-form-field>
</app-form-field>

<app-form-field
  class="sm:col-span-3"
  [label]="'admin.items.picture' | translate"
  [field]="form().image"
>
  <div class="flex flex-wrap items-center gap-4">
    @if (pictureUrl(); as url) {
      <img
        data-testid="picture-preview"
        [src]="url"
        alt=""
        class="h-24 w-32 rounded-md bg-surface-container object-cover"
      />
    } @else {
      <span
        aria-hidden="true"
        class="flex h-24 w-32 items-center justify-center rounded-md bg-surface-container text-on-surface-variant"
      >
        <mat-icon>image</mat-icon>
      </span>
    }
    <input
      #picture
      appFieldControl
      type="file"
      accept="image/png,image/jpeg,image/webp"
      class="sr-only"
      tabindex="-1"
      (change)="choose(picture)"
    />
    <button matButton="tonal" type="button" [disabled]="uploading()" (click)="picture.click()">
      <mat-icon>upload</mat-icon>
      {{ (pictureUrl() ? 'admin.items.changePicture' : 'admin.items.choosePicture') | translate }}
    </button>
    @if (pictureUrl()) {
      <button matButton type="button" (click)="remove()">
        {{ 'admin.items.removePicture' | translate }}
      </button>
    }
  </div>
  <p class="text-sm text-on-surface-variant">{{ 'admin.items.pictureHint' | translate }}</p>
  @if (pictureProblem(); as problem) {
    <p data-testid="picture-error" role="alert" class="text-sm text-error">
      {{ problem.code | translate: problem.params }}
    </p>
  }
</app-form-field>
