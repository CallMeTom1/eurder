<button mat-button [matMenuTriggerFor]="menu">
  <span aria-hidden="true" class="uppercase">{{ languages.language() }}</span>
  <span class="sr-only">{{ 'common.language' | translate }}</span>
</button>

<mat-menu #menu="matMenu">
  @for (option of options; track option.language) {
    <button
      mat-menu-item
      role="menuitemradio"
      [attr.aria-checked]="languages.language() === option.language"
      [attr.lang]="option.language"
      (click)="languages.choose(option.language)"
    >
      {{ option.name }}
    </button>
  }
</mat-menu>
