<button mat-icon-button [matMenuTriggerFor]="menu">
  <mat-icon aria-hidden="true">{{ currentIcon() }}</mat-icon>
  <span class="sr-only">{{ 'common.theme.title' | translate }}</span>
</button>

<mat-menu #menu="matMenu">
  @for (option of options; track option.preference) {
    <button
      mat-menu-item
      role="menuitemradio"
      [attr.aria-checked]="theme.preference() === option.preference"
      (click)="theme.choose(option.preference)"
    >
      <mat-icon aria-hidden="true">{{ option.icon }}</mat-icon>
      <span>{{ option.labelKey | translate }}</span>
    </button>
  }
</mat-menu>
